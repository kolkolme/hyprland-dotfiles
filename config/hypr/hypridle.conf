general {
    lock_cmd       = ~/.local/bin/lock   # EN-раскладка + hyprlock, без копий
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on && ~/.local/bin/dim off
    unlock_cmd       = ~/.local/bin/dim off        # после разблокировки яркость точно вернётся
}

listener {
    timeout = 300                                  # 5 мин — приглушить экран
    on-timeout = ~/.local/bin/dim on               # плавно гаснет до 12%, запоминая исходную
    on-resume  = ~/.local/bin/dim off              # любое движение — плавно возвращает
}

listener {
    timeout = 600                                  # 10 мин — блокировка
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900                                  # 15 мин — погасить экран
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
