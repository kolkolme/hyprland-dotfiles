background {
    monitor =
    path = /home/meetme/Pictures/wallpapers/gorod_noch_2000x1250.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    outer_color = rgba(c7b3c5ff) rgba(d7ccd4ff) 45deg
    inner_color = rgba(272527dd)
    check_color = rgba(f9e2afff)
    fail_color  = rgba(f38ba8ff)
    capslock_color = rgba(fab387ff)   # обводка оранжевая, пока включён Caps Lock
    rounding    = 14
    font_color  = rgb(e2dfe2)
    fade_on_empty = false
    placeholder_text = <span foreground="##b8b6b8">Пароль…</span>
    fail_text = <span foreground="##f38ba8">Неверно ($ATTEMPTS)</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(e2dfe2ee)
    font_size = 88
    font_family = JetBrains Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(d7ccd4cc)
    font_size = 16
    position = 0, 20
    halign = center
    valign = center
}

# раскладка в кружке справа от поля пароля (поле 320×50 в точке 0,-60)
shape {
    monitor =
    size = 46, 46
    rounding = -1                 # -1 = круг
    color = rgba(3c393cdd)
    border_size = 2
    border_color = rgba(c7b3c5ff)
    position = 195, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:250] ~/.local/bin/lock-kbd layout
    color = rgba(c7b3c5ff)
    font_size = 12
    font_family = JetBrains Mono ExtraBold
    position = 195, -60
    halign = center
    valign = center
}

# Caps Lock — под полем по центру, только когда включён
label {
    monitor =
    text = cmd[update:250] ~/.local/bin/lock-kbd caps
    color = rgba(f38ba8ff)
    font_size = 13
    font_family = JetBrains Mono ExtraBold
    position = 0, -115
    halign = center
    valign = center
}
