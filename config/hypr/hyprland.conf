# ═══════════════════════════════════════════════════════════
#  Hyprland — конфиг для Kali (Intel Iris Xe)
#  Справка по клавишам:  SUPER + H
#  Wiki: https://wiki.hyprland.org/
# ═══════════════════════════════════════════════════════════

# ─── Мониторы ───────────────────────────────────────────────
# имя,разрешение,позиция,масштаб.  hyprctl monitors — список
monitor = , preferred, auto, 1

# ─── Переменные ─────────────────────────────────────────────
$mod      = SUPER
$term     = kitty
$files    = thunar
$menu     = wofi --show drun
$browser  = xdg-open http://

# ─── Стабильность на Intel Iris Xe (i915) ────────────────────
# Эти настройки убрали зависания — не трогать.
debug {
    vfr = false                      # постоянная частота кадров: снимает подвисание
                                     # main-loop в ожидании page-flip
    fifo_pending_workaround = true   # обход зависания на fifo-протоколе
}

render {
    new_render_scheduling = false    # новый планировщик кадров — частая причина фризов
}

cursor {
    no_hardware_cursors = true       # программный курсор: аппаратный конфликтует
                                     # с атомарными commit-ами на i915
}

# ─── Автозапуск ─────────────────────────────────────────────
# Пробрасываем окружение в systemd/dbus — иначе порталы,
# скриншоты и файловые диалоги работать не будут.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

exec-once = /usr/libexec/polkit-mate-authentication-agent-1   # запрос пароля для GUI-программ
exec-once = waybar                                            # панель
exec-once = hyprpaper                                         # обои
exec-once = swaync                                            # уведомления + центр уведомлений (вместо mako)
exec-once = hyprsunset                                        # фильтр цвета для ночного режима
exec-once = sleep 2 && ~/.local/bin/nightmode apply            # вернуть выбранный режим экрана
exec-once = hypridle                                          # гашение экрана / автолок
# exec-once = nm-applet --indicator   # выключен 27.09.26: дублировал значок сети в трее.
#   Сеть теперь на панели waybar + ~/.local/bin/wifi. Агент секретов (окно ввода пароля
#   для openconnect-VPN и сетей 802.1X) скрипты ~/.local/bin/vpn и wifi поднимают сами
#   на время подключения и гасят после — постоянно висеть в трее ему незачем.
exec-once = wl-paste --watch cliphist store                   # история буфера обмена

# ─── Окружение ──────────────────────────────────────────────
env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = _JAVA_AWT_WM_NONREPARENTING,1

# ─── Ввод ───────────────────────────────────────────────────
input {
    kb_layout  = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity  = 0        # -1.0 .. 1.0, 0 = без ускорения

    touchpad {
        natural_scroll = true
        tap-to-click   = true
        disable_while_typing = true
        scroll_factor  = 0.5     # подстроить на лету: «scroll 0.4», «scroll -», «scroll +»
    }
    # колесо обычной мыши крутится своим темпом
    scroll_factor = 1.0
}

# ─── Жесты тачпада ──────────────────────────────────────────
gesture = 3, horizontal, workspace              # 3 пальца влево/вправо — рабочие столы
gesture = 3, vertical, special, dropterm        # 3 пальца вверх/вниз — выпадающий терминал
gesture = 4, up, dispatcher, exec, ~/.local/bin/windows   # 4 пальца вверх — все окна списком
gesture = 4, down, dispatcher, exec, ~/.local/bin/lock    # 4 пальца вниз — заблокировать экран
gestures {
    workspace_swipe_distance     = 400          # короче свайп — быстрее переключение
    workspace_swipe_cancel_ratio = 0.3          # хватает трети пути, дальше жест доводится сам
    workspace_swipe_create_new   = true         # свайп за последний стол создаёт новый
    workspace_swipe_min_speed_to_force = 8      # короткий резкий флик тоже переключает
    workspace_swipe_forever      = true         # не упирается в соседний стол, можно проскочить дальше
    workspace_swipe_direction_lock = true       # начал вести вбок — вертикаль больше не мешает
    workspace_swipe_direction_lock_threshold = 12
}

# ─── Внешний вид ────────────────────────────────────────────
general {
    # плавающие окна прилипают к краям экрана и друг к другу при перетаскивании
    snap {
        enabled     = true
        window_gap  = 10
        monitor_gap = 10
    }

    gaps_in     = 4
    gaps_out    = 8
    border_size = 2
    col.active_border   = rgba(c7b3c5ee) rgba(d7ccd4ee) 45deg   # mauve → pink, как в Waybar
    col.inactive_border = rgba(514e51aa)
    resize_on_border    = true
    allow_tearing       = false
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity   = 1.0
    inactive_opacity = 0.93     # неактивные окна чуть просвечивают

    blur {
        enabled     = true
        size        = 6
        passes      = 2          # 3 красивее, но тяжелее для Iris Xe
        new_optimizations = true
        vibrancy = 0.169600
        vibrancy_darkness = 0.000000
        noise = 0.011700
        contrast = 0.891600
        brightness = 1.000000
    }

    # В 0.45+ тени задаются блоком shadow{} — старые drop_shadow/col.shadow дают ошибки
    shadow {
        enabled = true
        range   = 12
        render_power = 3
        color   = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
    bezier  = smooth, 0.05, 0.9, 0.1, 1.0
    bezier  = snappy, 0.2, 1.0, 0.3, 1.0
    # для свайпа: подхватывает скорость пальцев и мягко тормозит, без рывка в конце
    bezier  = swipe,  0.12, 0.85, 0.18, 1.0
    # для выпадающего терминала: чуть проскакивает и возвращается — эффект «пружины»
    bezier  = spring, 0.34, 1.14, 0.36, 1.0

    animation = windows,     1, 4, snappy, popin 80%
    animation = windowsOut,  1, 4, smooth, popin 80%
    animation = border,      1, 8, smooth
    animation = fade,        1, 4, smooth

    # ── три пальца вбок: столы едут за пальцами и подтаивают на краю ──
    animation = workspaces,   1, 5.5, swipe, slidefade 15%
    # ── три пальца вверх/вниз: dropterm выезжает с лёгкой пружиной ──
    animation = specialWorkspace, 1, 5, spring, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    disable_splash_rendering = true
}

# ─── Правила окон (0.56: «эффект значение, match:поле regex»; вкл = 1, «on» не работает) ───
windowrule = float 1,  match:class ^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = size 900 600, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = center 1, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager)$
# окно входа в VPN (openconnect спрашивает пароль каждый раз) — по центру, поверх
windowrule = float 1,  match:class ^(nm-openconnect-auth-dialog|nm-applet|.*openconnect.*)$
windowrule = center 1, match:class ^(nm-openconnect-auth-dialog|nm-applet|.*openconnect.*)$
# игрушки открываются на своём столе и не перетягивают взгляд
windowrule = workspace name:toys silent, match:class ^(toy-.*)$

# календарь по клику на часы: маленькое окно под панелью, по центру
windowrule = float 1,  match:class ^(calendar-widget)$
windowrule = size 430 330, match:class ^(calendar-widget)$
windowrule = move 745 44, match:class ^(calendar-widget)$   # под часами по центру экрана 1920px

# Wi-Fi и Bluetooth по клику на значки: выпадают из панели у правого края.
# Открывается по одной — панель сама закрывает соседнюю (см. SIBLINGS в скриптах).
windowrule = float 1,  match:class ^(wifi-widget|bt-widget)$
windowrule = size 640 460, match:class ^(wifi-widget)$
windowrule = size 640 420, match:class ^(bt-widget)$
windowrule = move 1270 48, match:class ^(wifi-widget|bt-widget)$   # под значками справа, экран 1920px

# заметки открываются обычным окном в сетке, наравне с остальными.
# Плавающий вариант — на отдельном классе, вызывается Super+Ctrl+N.
windowrule = float 1,  match:class ^(notes-float)$
windowrule = size 900 560, match:class ^(notes-float)$
windowrule = center 1, match:class ^(notes-float)$

# задачник: плавающее окно по центру
windowrule = float 1,  match:class ^(tasks-tui)$
windowrule = size 760 520, match:class ^(tasks-tui)$
windowrule = center 1, match:class ^(tasks-tui)$
# виджет задач на рабочем столе — без рамки решений, просто плавающее окошко
windowrule = float 1,  match:class ^(tasks-widget)$
windowrule = size 430 260, match:class ^(tasks-widget)$

# Claude как приложение (chromium --app=, класс лепится из URL — отсюда такой вид).
# Тайлится в сетке наравне с остальными, как заметки. Плавающим — раскомментировать три строки:
# windowrule = float 1,       match:class ^(chrome-claude\.ai.*)$
# windowrule = size 1100 760, match:class ^(chrome-claude\.ai.*)$
# windowrule = center 1,      match:class ^(chrome-claude\.ai.*)$

windowrule = float 1,  match:title ^(Open File|Save File|Open Folder|Открыть файл|Сохранить файл|Выбор файла.*)$
windowrule = center 1, match:title ^(Open File|Save File|Open Folder|Открыть файл|Сохранить файл|Выбор файла.*)$
windowrule = float 1,  match:title ^(Picture-in-Picture|Картинка в картинке)$
windowrule = pin 1,    match:title ^(Picture-in-Picture|Картинка в картинке)$
# выпадающий терминал (Super+` или 3 пальца вниз)
workspace = special:dropterm, on-created-empty:kitty --class dropterm
windowrule = float 1,        match:class ^(dropterm)$
windowrule = size 1340 480,  match:class ^(dropterm)$
windowrule = move 290 52,    match:class ^(dropterm)$
windowrule = opacity 0.93 override 0.93 override, match:class ^(dropterm)$
# видео и полноэкранное — без прозрачности
windowrule = opacity 1.0 override 1.0 override, match:title .*(YouTube|VLC|mpv).*
windowrule = opacity 1.0 override 1.0 override, match:class ^(mpv|vlc)$

# ═══════════════════════════════════════════════════════════
#  КЛАВИШИ
# ═══════════════════════════════════════════════════════════

# ─── Запуск программ ────────────────────────────────────────
bind = $mod, Return, exec, $term
bind = $mod, Q,      exec, $term
bind = $mod, E,      exec, $files
bind = $mod, R,      exec, $menu
bind = $mod, D,      exec, $menu
bind = $mod, H,      exec, ~/.local/bin/hypr-help      # шпаргалка по клавишам
bind = $mod, V,      exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod, N,      exec, kitty --class notes-tui -e ~/.local/bin/notes     # заметки в сетке
bind = $mod CTRL, N, exec, kitty --class notes-float -e ~/.local/bin/notes   # заметки плавающим окном
bind = $mod SHIFT, N, exec, ~/.local/bin/notes quick                        # быстро записать мысль
bind = $mod, T,      exec, kitty --class tasks-tui -e ~/.local/bin/tasks   # задачник поверх окон
bind = $mod CTRL, T, exec, kitty --class tasks-tiled -e ~/.local/bin/tasks # задачник обычным окном в сетке
bind = $mod SHIFT, T, exec, ~/.local/bin/tasks quickadd                    # быстро добавить задачу
bind = $mod, W,      exec, ~/.local/bin/wallpick          # выбор обоев (цвета подстроятся)
bind = $mod SHIFT, W, exec, ~/.local/bin/wallpick random   # случайные обои

# ─── Управление окнами ──────────────────────────────────────
bind = $mod, C,          killactive,
bind = $mod SHIFT, Q,    killactive,
bind = $mod, F,          fullscreen, 0
bind = $mod SHIFT, F,    togglefloating,
bind = $mod, P,          pseudo,
bind = $mod, J,          layoutmsg, togglesplit   # dwindle: сменить направление деления

# Фокус — стрелки или vim-клавиши
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Перемещение окна
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Размер окна
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive,  40 0
binde = $mod CTRL, up,    resizeactive,  0 -40
binde = $mod CTRL, down,  resizeactive,  0  40

# Мышь: перетаскивание и ресайз
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
# Что происходит, когда бросил окно: у края — прилипает половиной, в углу —
# четвертью, посередине — возвращается в сетку. Плиточные окна не трогаются:
# их перетаскивание Hyprland завершает обменом местами.
bindr = $mod, mouse:272, exec, ~/.local/bin/snapdrop

# ─── Рабочие столы ──────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, grave, togglespecialworkspace, dropterm   # выпадающий терминал
bind = $mod, G,     exec, ~/.local/bin/games      # меню: игрушки и игры Steam
bind = $mod, S,     togglespecialworkspace, magic   # «карман» для окна
bind = $mod SHIFT, S, exec, ~/.local/bin/screenshot area   # скриншот области
bind = $mod SHIFT, X, movetoworkspace, special:magic       # убрать окно в «карман» (было на Shift+S)
bind = $mod, I,     exec, ~/.local/bin/wifi --toggle   # панель Wi-Fi (та же, что по значку)
bind = $mod, B,     exec, ~/.local/bin/bt --toggle     # панель Bluetooth

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bind = $mod, Tab,        workspace, e+1
bind = $mod SHIFT, Tab,  workspace, e-1

# ─── Скриншоты ──────────────────────────────────────────────
# выделить область → в буфер и в ~/Pictures
bind = , Print,        exec, ~/.local/bin/screenshot area
bind = SHIFT, Print,   exec, ~/.local/bin/screenshot full
bind = $mod, Print,    exec, ~/.local/bin/screenshot clip

# ─── Звук / яркость / медиа ─────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

# ─── Сессия ─────────────────────────────────────────────────
bind = $mod, L,       exec, ~/.local/bin/lock     # заблокировать экран (с переключением на EN)
bind = $mod SHIFT, E, exec, wlogout -b 5 -T 380 -B 380   # меню выхода/выключения
bind = $mod SHIFT, M, exit,                   # выйти из Hyprland
bind = $mod SHIFT, R, exec, hyprctl reload    # перечитать конфиг

# ─── Размытие под Waybar ─────────────────────────────────────
layerrule = blur 1, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar
layerrule = blur 1, match:namespace swaync-control-center
layerrule = blur 1, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.3, match:namespace swaync-.*
