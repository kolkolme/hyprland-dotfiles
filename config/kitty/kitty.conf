font_family      JetBrains Mono
font_size        11.0
cursor_shape     beam
scrollback_lines 10000

# ─── Плавная прокрутка ──────────────────────────────────────────────
# По пикселям, а не по строкам: с тачпада буфер едет дробными долями строки.
pixel_scroll yes
# Инерция: после отрыва пальцев прокрутка докатывается и плавно тормозит.
# 0 — инерции нет, 1 — катится бесконечно. Значение применяется при запуске окна.
momentum_scroll 0.97
# Тачпад: компенсируем замедление, заданное на уровне Hyprland (scroll_factor 0.5).
touch_scroll_multiplier 1.6
# Колесо мыши: по умолчанию 5 строк за щелчок — крупными рывками. Три мягче.
wheel_scroll_multiplier 3.0
wheel_scroll_min_lines 1
# Перерисовка чаще стандартных 10 мс — на 60 Гц движение выглядит непрерывным.
repaint_delay 7
input_delay 2
sync_to_monitor yes

enable_audio_bell no
# window_padding_width 8  (перенесено ниже)
background_opacity 0.82
dynamic_background_opacity yes   # менять на лету: Ctrl+Shift+A затем M (темнее) или L (светлее)
confirm_os_window_close 0
tab_bar_style powerline

# Kali-ish dark

# ─── Цвета: Catppuccin Mocha (в тон Waybar и обоям) ───
foreground           #e2dfe2
background           #272527
selection_foreground #272527
selection_background #d7ccd4
cursor               #f5e0dc
cursor_text_color    #272527
url_color            #d7ccd4
active_border_color   #c7b3c5
inactive_border_color #7b777a
active_tab_foreground   #171517
active_tab_background   #c7b3c5
inactive_tab_foreground #e2dfe2
inactive_tab_background #1f1e1f
tab_bar_background      #171517
color0  #514e51
color8  #666265
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #d7ccd4
color13 #d7ccd4
color6  #94e2d5
color14 #94e2d5
color7  #cdcbcd
color15 #b8b6b8

# ─── Оформление ───
window_padding_width 12
cursor_trail 3
cursor_blink_interval 0.6
tab_bar_edge top
tab_bar_min_tabs 2
